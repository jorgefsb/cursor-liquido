<!doctype html>
<!-- Integration fixture: a plain page that loads the packaged dist/ build and
     nothing else. No intensity attribute, no selector. Tests mount it. -->
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Cursor líquido · fixture</title>
<link rel="stylesheet" href="../../dist/cursor-liquido.css">
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0a0a0a; color: #fff; }
  body { margin: 0; min-height: 100vh; }
  main { padding: 24px; }
  .arena { position: relative; height: 520px; }
  .box { position: absolute; left: 520px; top: 180px; width: 160px; height: 100px; border-radius: 12px; background: #ff6b35; }
  .legacy { position: absolute; left: 760px; top: 180px; width: 120px; height: 100px; background: #335; }
  #mount-here { position: relative; }
</style>
</head>
<body>
<main>
  <h1 id="title">Fixture del paquete</h1>
  <p id="copy">Texto de control con acentos: áéíóú ñ. El cursor no debe cambiar estos glifos.</p>
  <button type="button" id="counter">Clics: 0</button>
  <a href="#fin" id="link">Ir al fin</a>
  <label>Campo <input id="field" type="text" autocomplete="off"></label>
  <div class="arena">
    <div class="box" data-liquid-obstacle></div>
    <div class="legacy" data-fluid-obstacle></div>
  </div>
  <div id="mount-here"></div>
  <p id="fin">Fin.</p>
</main>
<script src="../../dist/cursor-liquido.js"></script>
<script>
  document.getElementById('counter').addEventListener('click', function () {
    this.dataset.n = String((+this.dataset.n || 0) + 1);
    this.textContent = 'Clics: ' + this.dataset.n;
  });
</script>
</body>
</html>
